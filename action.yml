name: skeptic-diff-audit
# The Marketplace caps description at 125 characters and requires branding.
description: >-
  Audit a PR diff for reward-hacking patterns with skeptic verify --diff.
  Deterministic, no API key. Report-only by default.
branding:
  icon: eye
  color: gray-dark
inputs:
  base-ref:
    description: Ref to diff HEAD against. Defaults to the PR's base branch.
    default: ${{ github.base_ref }}
  fail-on:
    description: >-
      Exit-code posture: fail, suspect, or never. Report-only (never) is the
      default until a diff-posture false-positive rate on real clean PRs is
      measured.
    default: never
  install:
    description: >-
      Install command for the audit image. Name the extra that provides any
      plugin your pytest config's addopts needs, e.g. pip install -q -e .[test]
    default: pip install -q -e . pytest
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    # The consumer's `uses: mamadou-wane/skeptic@<ref>` is the version
    # authority; installing from $GITHUB_ACTION_PATH runs whatever ref that
    # was, never a second pin chosen inside the action.
    - run: pip install -q "$GITHUB_ACTION_PATH"
      shell: bash
    - name: Validate fail-on
      shell: bash
      env: { FAIL_ON: "${{ inputs.fail-on }}" }
      run: |
        case "$FAIL_ON" in
          fail|suspect|never) ;;
          *) echo "::error::fail-on must be one of fail, suspect, never (got '$FAIL_ON')" >&2
             exit 1 ;;
        esac
    - name: Resolve merge base
      id: mergebase
      shell: bash
      env: { BASE_REF: "${{ inputs.base-ref }}" }
      run: |
        if [ -z "$BASE_REF" ]; then
          echo "::error::base-ref is empty. github.base_ref is only set on pull_request events; pass base-ref explicitly." >&2
          exit 1
        fi
        sha="$(git merge-base "origin/$BASE_REF" HEAD)" || sha="$(git merge-base "$BASE_REF" HEAD)" || true
        if [ -z "$sha" ]; then
          echo "::error::git merge-base found no common ancestor between '$BASE_REF' and HEAD. actions/checkout defaults to a shallow clone; set 'fetch-depth: 0' on the checkout step and re-run." >&2
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: Audit the diff
      id: verify
      shell: bash
      env:
        NO_COLOR: "1"
        MERGE_BASE: "${{ steps.mergebase.outputs.sha }}"
        INSTALL: "${{ inputs.install }}"
      run: |
        mkdir -p "$RUNNER_TEMP/skeptic"
        patch="$RUNNER_TEMP/skeptic-diff.patch"
        out="$RUNNER_TEMP/skeptic-verify.txt"
        git diff --binary "$MERGE_BASE..HEAD" > "$patch"
        set +e
        skeptic verify --diff "$patch" --repo . --base "$MERGE_BASE" \
          --install "$INSTALL" --workdir "$RUNNER_TEMP/skeptic" > "$out" 2>&1
        echo "code=$?" >> "$GITHUB_OUTPUT"
        set -e
        cat "$out"
        { echo "### Skeptic diff audit"; echo; echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
    - name: Apply fail-on
      shell: bash
      env:
        FAIL_ON: "${{ inputs.fail-on }}"
        CODE: "${{ steps.verify.outputs.code }}"
      run: |
        case "$FAIL_ON" in
          never) exit 0 ;;
          suspect) [ "$CODE" -ge 1 ] && exit 1 || exit 0 ;;
          fail) { [ "$CODE" = "2" ] || [ "$CODE" = "3" ]; } && exit 1 || exit 0 ;;
          *) echo "::error::fail-on must be one of fail, suspect, never (got '$FAIL_ON')" >&2
             exit 1 ;;
        esac
