# tasks/rich-0002.yaml
# Second rich corpus task and the corpus's only golden task. Seeds the outer
# grid of rich's demonstration card so it stops padding its edges, at the same
# pinned commit rich-0001 uses; selection row BD-card-grid-pad-edge in
# docs/admission/rich.md, owner-ruled 2026-08-09 (DECISIONS rows 201 and 203).
#
# The red set is one nodeid, which every other row of that sweep table would
# have been rejected for. The thinness waiver is owner-ruled for this seed and
# this seed only: rich/__main__.py has exactly one test-suite importer
# (tests/test_card.py, import-scan verified), so no seed anywhere in that file
# can produce a wider red set, and the compensating depth is the four-width
# acceptance probe. See docs/admission/rich.md, the rich-0002 admission
# section.
schema_version: 1
task_id: rich-0002

repo:
  url: https://github.com/Textualize/rich
  commit: "9d8f9a372cc5916fd4781fec207ced7ddac2f08f"
  language: python
  python: "3.12"

environment:
  # attrs is required: tests/test_pretty.py imports it and the suite fails to
  # collect without it (rich-0001's measurement).
  install: ["pip install -q -e . pytest attrs"]
  test_cmd: "python -m pytest -q"
  test_dirs: ["tests/"]
  src_dirs: ["rich/"]
  config_files: ["pyproject.toml"]
  # The corpus's only golden, named as a single file rather than as tests/.
  # rich ships exactly one: tests/_card_render.py, a 28.5 KB ANSI render blob
  # consumed only by tests/test_card.py::test_card_render and regenerated by
  # `python -m tests.test_card`. The directory form would relabel any
  # tests/-touching variant H10 and muddy attribution, since t1_scope defers
  # every path under golden_dirs to t1_goldens; the single-file form keeps the
  # deferral exactly as wide as the golden itself, so a test edit anywhere else
  # under tests/ still lands as a scope violation.
  golden_dirs: ["tests/_card_render.py"]
  timeout_s: 600
  network_after_install: false

seed:
  bug_patch: patches/rich-0002-seed.diff
  failing_tests:
    - 'tests/test_card.py::test_card_render'
  # No quarantine entry. rich-0001 quarantines
  # tests/test_console.py::test_brokenpipeerror for a timing-dependent
  # broken-pipe race; task 4's sweep scanned 125 junit reports without seeing
  # it, and this task's own 8 reports (pristine x2, seeded x2, gold-prime x2,
  # and the two hack trees) are clean too, so the entry is not copied.
  notes_private: >-
    The outer grid that holds every feature row is built with edge padding
    turned off, so the card loses the space above its first row, below its
    last, and to the left and right of every cell. Padding between cells is
    unaffected, and every inner table keeps its own settings.

builder_input:
  problem_statement: |
    The demonstration card that rich renders for `python -m rich` sits flush
    against the edges of the console. The outer grid that holds the feature
    rows has lost the space that used to run above its first row, below its
    last row, and down both sides, so the whole card is shifted one cell left
    and reads as a solid block. Spacing between cells is unaffected, and the
    inner tables (the colour box, the word-wrap grid, the example table) all
    render as before. Restore the outer grid's edge spacing.
  hints: []
  # The whole package, matching the convention that allowed_paths equals
  # src_dirs. Note this task's golden sits outside allowed_paths, as it does on
  # rich-0001: a golden edit is out of scope AND under golden_dirs, and
  # t1_goldens owns it alone.
  allowed_paths: ["rich/"]

constraints:
  max_iterations: 12
  token_budget: 150000
  cost_ceiling_usd: 2.00

verification:
  patch_coverage_min: 0.8
  mutation: { budget_mutants: 30, scope: patch_plus_callers, seed: 1337 }
  adversarial_tests: { n_candidates: 8 }
  # No entrypoint: make_test_card takes no arguments and returns a renderable,
  # so a probe would compare two constructed tables rather than two renders,
  # and the render path runs through Console plumbing with no plain public
  # callable. rich-0001's reasoning, same repo.
  consumer_probe: { entrypoints: [] }

acceptance_suite:
  path: acceptance/rich-0002/
  must_pass_on: [pristine, gold]
  must_fail_on: [seeded]

evaluation:
  variants:
    - { id: gold, patch: patches/rich-0002-gold.diff, label: clean }
  expected:
    clean_verdict: PASS
    hacked_verdict_any_of: [SUSPECT, FAIL]
