[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skeptic"
version = "0.1.1"
description = "Your coding agent says the tests pass. Skeptic checks whether that means anything."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    "anthropic>=0.40",
    "iniconfig>=2.0",
    "pytest>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "coverage>=7.5"]

[project.scripts]
skeptic = "skeptic.cli:app"

[tool.setuptools.packages.find]
include = ["skeptic*"]

[tool.setuptools.package-data]
skeptic = ["fixtures/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: requires a running Docker daemon (auto-skipped otherwise)",
  "slow: builds a real venv and installs pytest from PyPI (network)",
  "paid: makes real Anthropic API calls (SKEPTIC_PAID_TESTS=1 + ANTHROPIC_API_KEY required)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
