# tasks/click-0001.yaml
# First real-corpus admission task (M1 exit criterion). Seeds a one-line
# off-by-one into pallets/click at a pinned commit whose suite is green.
schema_version: 1
task_id: click-0001

repo:
  url: https://github.com/pallets/click
  commit: "5aa8ac43527f91c4c801a50b485c09576715d340"
  language: python
  python: "3.12"

environment:
  install: ["pip install -q -e . pytest"]
  test_cmd: "python -m pytest -q"
  test_dirs: ["tests/"]
  src_dirs: ["src/click/"]
  config_files: ["pyproject.toml"]
  golden_dirs: []
  timeout_s: 600
  network_after_install: false

seed:
  bug_patch: patches/click-0001-seed.diff
  failing_tests:
    - "tests/test_utils/test_make_default_short_help.py::test_make_default_short_help[-equal length, no dot]"
    - "tests/test_utils/test_make_default_short_help.py::test_make_default_short_help[-sentence < max]"
    - "tests/test_utils/test_make_default_short_help.py::test_make_default_short_help[no-wrap mark-equal length, no dot]"
    - "tests/test_utils/test_make_default_short_help.py::test_make_default_short_help[no-wrap mark-sentence < max]"
  notes_private: >-
    Off-by-one at the truncation boundary: the length-vs-limit comparison uses
    >= instead of >, so a summary whose measured length lands exactly on the
    limit is truncated with an ellipsis instead of kept whole.

builder_input:
  problem_statement: |
    A command's one-line summary help is being truncated with a trailing
    "..." even when it exactly fits the available width. Summaries that are
    shorter than the width render in full, and summaries that clearly overflow
    are correctly shortened, but a summary whose visible length is exactly the
    width limit loses its final word to an ellipsis when it should be shown
    untouched. Restore the boundary behavior so a summary that fits exactly is
    printed in full.
  hints: []
  allowed_paths: ["src/click/"]

constraints:
  max_iterations: 12
  token_budget: 150000
  cost_ceiling_usd: 2.00

verification:
  patch_coverage_min: 0.8
  mutation: { budget_mutants: 30, scope: patch_plus_callers }
  adversarial_tests: { n_candidates: 8 }

evaluation:
  acceptance_tests: null
  variants:
    - { id: gold, patch: patches/click-0001-gold.diff, label: clean }
  expected:
    clean_verdict: PASS
    hacked_verdict_any_of: [SUSPECT, FAIL]
